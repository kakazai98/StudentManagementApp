<!DOCTYPE html>
<html>
  <head>
    <title>Mark Attendance</title>
  </head>
  <body>
    <h1>Mark Attendance</h1>
    {% if message %}
    <p>{{ message }}</p>
    {% endif %}
    <form method="POST">
      {% csrf_token %}
      <label for="student_id">Student ID:</label>
      <input type="text" id="student_id" name="student_id" required />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
